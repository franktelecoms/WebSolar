<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitorización FusionSolar</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --subcard: #162032;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      line-height: 1.35;
      font-size: 14px;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    h1 { font-size: 1.25rem; color: var(--accent); }
    .controls { display: flex; align-items: center; gap: 8px; }
    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg {
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      margin-bottom: 14px;
      font-size: 0.85rem;
    }
    .status-error { border-color: var(--danger); color: #fca5a5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .kpi-card.highlight {
      border-color: rgba(56, 189, 248, 0.5);
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.08) 0%, var(--card) 100%);
    }
    .kpi-card h3 { font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; font-weight: 500; }
    .kpi-card .value { font-size: 1.3rem; font-weight: 700; }
    .kpi-card.highlight .value { color: var(--accent); }

    /* Cabecera de columnas */
    .columns-header {
      display: grid;
      grid-template-columns: 1fr 105px 105px 105px 115px 125px;
      gap: 8px;
      padding: 6px 14px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .columns-header div:not(:first-child) {
      text-align: right;
    }

    /* Tarjeta compacta por Planta */
    .plant-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .plant-header {
      display: grid;
      grid-template-columns: 1fr 105px 105px 105px 115px 125px;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      background: rgba(15, 23, 42, 0.45);
      border-bottom: 1px solid var(--border);
    }
    .plant-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .plant-code { font-size: 0.72rem; color: var(--muted); margin-left: 6px; font-weight: 400; }
    .col-val {
      text-align: right;
      font-size: 0.85rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .col-val.live { color: var(--accent); }
    .col-val.ok { color: var(--success); }
    .col-label-mobile { display: none; font-size: 0.7rem; color: var(--muted); font-weight: 400; }

    @media (max-width: 780px) {
      .columns-header { display: none; }
      .plant-header {
        grid-template-columns: repeat(2, 1fr);
      }
      .plant-name-wrap { grid-column: 1 / -1; margin-bottom: 4px; }
      .col-val { text-align: left; }
      .col-label-mobile { display: inline; }
    }

    /* Subsecciones compactas (Equipos y Alarmas) */
    .plant-details {
      padding: 7px 14px;
      background: var(--subcard);
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.75rem;
    }
    .detail-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
    }
    .detail-label {
      color: var(--muted);
      font-weight: 600;
      min-width: 68px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .items-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      flex: 1;
    }
    .chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      color: #cbd5e1;
      font-size: 0.73rem;
    }
    .chip strong { color: var(--text); font-weight: 600; }
    .chip .kw-tag { color: var(--accent); font-weight: 600; margin-left: 4px; }
    .chip-alarm {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .text-ok { color: var(--success); font-size: 0.73rem; }
    .text-muted { color: var(--muted); font-size: 0.73rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Panel Solar FusionSolar</h1>
        <small id="last-update" style="color: var(--muted); font-size: 0.75rem;">Esperando datos...</small>
      </div>
      <div class="controls">
        <span id="source-badge" class="badge">Sin conectar</span>
        <button id="btn-refresh" onclick="cargarDatos(true)">Actualizar ahora</button>
      </div>
    </header>

    <div id="status-box" class="status-msg">Conectando con la API de FusionSolar...</div>

    <div class="grid" id="kpi-grid">
      <div class="kpi-card"><h3>Plantas activas</h3><div class="value" id="kpi-plantas">-</div></div>
      <div class="kpi-card highlight"><h3>Potencia actual (kW)</h3><div class="value" id="kpi-actual">-</div></div>
      <div class="kpi-card"><h3>Energía hoy (kWh)</h3><div class="value" id="kpi-dia">-</div></div>
      <div class="kpi-card"><h3>Energía total (kWh)</h3><div class="value" id="kpi-total">-</div></div>
      <div class="kpi-card"><h3>Alarmas (7 días)</h3><div class="value" id="kpi-alarmas">-</div></div>
    </div>

    <div class="columns-header" id="col-headers" style="display: none;">
      <div>Planta</div>
      <div>Capacidad (kW)</div>
      <div>Actual (kW)</div>
      <div>Hoy (kWh)</div>
      <div>Mes (kWh)</div>
      <div>Total (kWh)</div>
    </div>

    <div id="lista-plantas"></div>
  </div>

  <script>
    function fmt(val) {
      if (val === null || val === undefined || val === "") return "-";
      const num = Number(val);
      return isNaN(num) ? val : num.toLocaleString("es-ES", { maximumFractionDigits: 2 });
    }

    async function cargarDatos(forzar = false) {
      const btn = document.getElementById("btn-refresh");
      const statusBox = document.getElementById("status-box");
      const badge = document.getElementById("source-badge");
      const colHeaders = document.getElementById("col-headers");

      btn.disabled = true;
      statusBox.className = "status-msg";
      statusBox.style.display = "block";
      statusBox.textContent = forzar
        ? "Consultando servidores en tiempo real (puede tardar unos 15 segundos)..."
        : "Cargando datos desde el servidor...";

      try {
        const url = forzar ? "/api/datos?forzar=true" : "/api/datos";
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || `Error HTTP ${res.status}`);
        }

        statusBox.style.display = "none";
        document.getElementById("last-update").textContent =
          `Última actualización: ${data.ultima_actualizacion || "-"}`;
        badge.textContent = `Fuente: ${data.fuente || "API"}`;

        const plantas = data.plantas || [];
        const equipos = data.equipos || [];
        const alarmas = data.alarmas || [];
        const telemetria = data.telemetria || {};

        // Mapa de potencia instantánea por devId (inversores residenciales=1, comerciales=39)
        const potenciaPorDevId = {};
        ["1", "39"].forEach(tipo => {
          (telemetria[tipo] || []).forEach(t => {
            if (t.devId !== undefined && t.active_power !== null && t.active_power !== undefined) {
              potenciaPorDevId[String(t.devId)] = Number(t.active_power) || 0;
            }
          });
        });

        let potenciaTotalActual = 0;
        let energiaDia = 0;
        let energiaTotal = 0;

        plantas.forEach(p => {
          energiaDia += Number(p.day_power || 0);
          energiaTotal += Number(p.total_power || 0);
        });

        const contenedor = document.getElementById("lista-plantas");

        if (!plantas.length) {
          colHeaders.style.display = "none";
          document.getElementById("kpi-plantas").textContent = "0";
          document.getElementById("kpi-actual").textContent = "0";
          document.getElementById("kpi-dia").textContent = "0";
          document.getElementById("kpi-total").textContent = "0";
          document.getElementById("kpi-alarmas").textContent = alarmas.length;
          contenedor.innerHTML = `<div class="status-msg" style="color: var(--muted);">No se encontraron plantas asignadas.</div>`;
          return;
        }

        colHeaders.style.display = "";

        const htmlPlantas = plantas.map(p => {
          const codigo = p.plantCode || p.stationCode || "";
          const nombrePlanta = p.plantName || p.stationName || "Planta sin nombre";
